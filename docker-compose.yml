# Nobil Prest · Depozit & livrări — aplicația + HTTPS automat (Caddy).
# Pornire recomandată: sudo ./scripts/instalare-server.sh   (vezi docs/GHID-INSTALARE.md)
# Manual: completați .env (după .env.example), apoi: docker compose up -d --build
services:
  app:
    build: .
    image: nobilprest:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
